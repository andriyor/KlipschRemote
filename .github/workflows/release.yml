name: Release

# One-shot release pipeline: on a version tag (v*) it builds BOTH the Windows
# installer and the Linux .deb package in parallel, then publishes them together
# to a SINGLE GitHub Release named after the tag.
#
# How to cut a release:
#   git tag v0.2.0
#   git push origin v0.2.0
# -> two build jobs run, then one Release "Klipsch Remote v0.2.0" with both
#    KlipschRemote-Setup.exe and klipsch-remote_0.2.0_amd64.deb attached.
#
# (The standalone Build Windows installer / Build Linux package workflows are
# manual-only now and do NOT publish releases, so a tag produces exactly one.)
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the Release and attach assets

jobs:
  # ---------------------------------------------------------------- Windows --
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Flutter creates plugin symlinks during `flet build`. Runners are elevated
      # so this usually works, but enabling Developer Mode + git symlinks makes it
      # deterministic regardless of the plugin set.
      - name: Enable Developer Mode and git symlinks
        shell: pwsh
        run: |
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" `
            /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"
          git config --global core.symlinks true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # `flet build` downloads and manages its own pinned Flutter SDK under
      # %USERPROFILE%\flutter; cache it (and the pub cache) so reruns skip the
      # multi-minute first-time download/compile. Keyed on the flet version
      # declared in pyproject.toml so a flet bump invalidates the cache.
      - name: Cache Flutter SDK and pub cache
        uses: actions/cache@v4
        with:
          path: |
            ~/flutter
            ~/AppData/Local/Pub/Cache
          key: flet-flutter-${{ runner.os }}-${{ hashFiles('packaging/pyproject.toml') }}
          restore-keys: |
            flet-flutter-${{ runner.os }}-

      - name: Install pinned dependencies (flet CLI + app deps)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # Stamp the installer's version from the tag (strip the leading "v") so the
      # Setup.exe / Add-Remove-Programs entry matches the release. Falls back to
      # the value already in installer.iss if the tag isn't vX.Y.Z shaped.
      - name: Set installer version from tag
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -match '^\d+(\.\d+){1,3}$') {
            (Get-Content installer.iss) `
              -replace '(#define MyAppVersion ").*(")', "`${1}$ver`${2}" |
              Set-Content installer.iss
            Write-Host "installer.iss MyAppVersion -> $ver"
          } else {
            Write-Host "Tag '$ver' not X.Y.Z; keeping installer.iss version as-is"
          }

      # Stages a clean project, runs `flet build windows`, patches the runner
      # (hidden/centred/sized window) + lib/main.dart (hide_window_on_start), then
      # recompiles and collects the bundle into dist_app\.
      - name: Build native bundle (flet build)
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File build_app.ps1

      # Inno Setup is preinstalled on windows-latest; fall back to Chocolatey if a
      # future image drops it.
      - name: Compile installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlipschRemote-Setup
          path: dist_installer/KlipschRemote-Setup.exe
          if-no-files-found: error

  # ------------------------------------------------------------------ Linux --
  linux:
    # Ubuntu 22.04 (glibc 2.35) compatibility baseline: a .deb built there
    # installs on that distro and anything newer (most current distros).
    #
    # Frozen with PyInstaller, NOT `flet build linux`: the latter bundles a
    # standalone CPython without AF_BLUETOOTH, so the L2CAP backend can't open the
    # Classic ATT channel ("this Python build has no Linux Bluetooth L2CAP
    # support"). The distro CPython used here has it; build_app_linux.sh hard-fails
    # if it ever doesn't, so a broken release can't ship.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the DISTRO CPython (apt), NOT actions/setup-python: Ubuntu builds it
      # against libbluetooth-dev so socket.AF_BLUETOOTH is present. dpkg-deb (for
      # packaging) is preinstalled on the runner.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev

      - name: Set up virtualenv and install deps (app + PyInstaller)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # Verifies AF_BLUETOOTH, freezes with PyInstaller, bundles the flet desktop
      # client for offline use, and packages the .deb into dist_installer/. The
      # package version is stamped from the tag (strip the leading "v") when it's
      # X.Y.Z-shaped; otherwise build_app_linux.sh keeps the pyproject version.
      - name: Build .deb (build_app_linux.sh)
        run: |
          chmod +x build_app_linux.sh
          ver="${GITHUB_REF_NAME#v}"
          if printf '%s' "$ver" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'; then
            export VERSION="$ver"
            echo "Package version -> $VERSION (from tag)"
          else
            echo "Tag '$GITHUB_REF_NAME' not X.Y.Z; keeping pyproject version"
          fi
          PYTHON="$PWD/.venv/bin/python" ./build_app_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlipschRemote-deb
          path: dist_installer/*.deb
          if-no-files-found: error

  # ---------------------------------------------------------------- Release --
  # Runs only after BOTH builds succeed, so a half-built release never ships.
  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      # Pull both build jobs' uploaded artifacts into ./artifacts/<name>/.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Named, published (non-draft) release with auto-generated notes from
          # the commits since the previous tag; both installers attached.
          name: Klipsch Remote ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/KlipschRemote-Setup/KlipschRemote-Setup.exe
            artifacts/KlipschRemote-deb/*.deb
