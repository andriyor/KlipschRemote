name: Build Linux package

# Freezes the app with PyInstaller (build_app_linux.sh) and packages it as an
# installable .deb that registers in the applications menu. Manual-only: produces
# the .deb as a downloadable artifact for testing. Tag-driven releases are handled
# by release.yml.
#
# WHY NOT `flet build linux`?
#   `flet build linux` embeds a standalone CPython (serious_python) compiled
#   WITHOUT the BlueZ headers, so its `socket` has no AF_BLUETOOTH — and the
#   Linux control path is raw-L2CAP-over-BR/EDR, which needs it. Such a build
#   throws "this Python build has no Linux Bluetooth L2CAP support" and can't
#   connect at all. PyInstaller freezes with the runner's DISTRO CPython, which
#   is built against libbluetooth-dev and keeps AF_BLUETOOTH. build_app_linux.sh
#   hard-fails if the interpreter ever lacks it, so a broken binary can't ship.
#
# Built on Ubuntu 22.04 (glibc 2.35) as the compatibility baseline: linked there
# it runs on that distro and anything newer.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the DISTRO CPython (apt), NOT actions/setup-python: Ubuntu builds
      # CPython against libbluetooth-dev, so socket.AF_BLUETOOTH is present. The
      # setup-python prebuilt binaries can't be relied on for that. dpkg-deb (for
      # packaging) is preinstalled on the runner.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev

      # Freeze with a venv off the distro python; the app deps + PyInstaller live
      # in it. requirements.txt is the pinned known-good set.
      - name: Set up virtualenv and install deps (app + PyInstaller)
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      # build_app_linux.sh verifies AF_BLUETOOTH (hard-fails otherwise), freezes
      # with PyInstaller, bundles the flet desktop client for offline use, and
      # packages the .deb into dist_installer/.
      - name: Build .deb (build_app_linux.sh)
        run: |
          chmod +x build_app_linux.sh
          PYTHON="$PWD/.venv/bin/python" ./build_app_linux.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: KlipschRemote-deb
          path: dist_installer/*.deb
          if-no-files-found: error
